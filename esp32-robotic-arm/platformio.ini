; Projeto: Controle de Braço Robótico 6 eixos com ESP32
; Ambiente PlatformIO (VSCode). Se preferir Arduino IDE, veja o README.md.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Bibliotecas necessárias (nomes como aparecem no Arduino Library Manager;
; se o índice do PlatformIO Registry mudar, procure por estes mesmos nomes).
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson @ ^7.0.0
    madhephaestus/ESP32Servo @ ^3.0.0

board_build.filesystem = littlefs

; Depois de gravar o firmware, envie os arquivos da pasta data/ para o
; sistema de arquivos do ESP32 com:
;   pio run --target uploadfs
